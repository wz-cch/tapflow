name: Android

on:
  # Every branch, not just main. This is a solo repo where most work happens on
  # feature/* branches, and the whole point of CI here is that nothing gets built
  # locally — so a branch that never builds would go unnoticed until merge time.
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Used for both the version inside the app and the artifact's name. Every artifact used to be
      # called app-debug, so two downloads looked identical in the Downloads folder and a week-old one
      # got installed and reported against — which cost a whole round of debugging to notice.
      - name: Short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # This machine has no Android Studio, so gradle-wrapper.jar (a binary) cannot be
      # produced here and CI installs Gradle directly. Once the project has been opened
      # in Android Studio once, the wrapper will exist and this can become ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      # buildId ends up in versionName and is shown in the app, so a bug report says which
      # commit it came from.
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug -PbuildId=${SHORT_SHA} --stacktrace 2>&1 | tee build.log

      # Compiler errors are otherwise only visible inside the raw log, which needs an
      # authenticated API call to read. Emitting them as an annotation puts them on the
      # commit page, and makes them readable without credentials.
      - name: Surface build failure as an annotation
        if: failure()
        run: |
          {
            (grep -E '^(e:|ERROR|error:|FAILED|Manifest merger)' build.log || true) | head -n 40
            echo "--- what went wrong ---"
            (grep -A 20 '^\* What went wrong' build.log || true) | head -n 25
            echo "--- tail of build output ---"
            # Drop Java stack frames: they are always Gradle internals and crowd out the
            # only lines that matter.
            (grep -v -E '^\s+at [a-z]+\.' build.log || true) | tail -n 30
          } > failure.txt
          # One multi-line annotation rather than many: GitHub caps how many it shows per
          # step, and workflow commands need newlines percent-escaped.
          body=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' failure.txt | awk '{ printf "%s%%0A", $0 }')
          echo "::error title=Build failure::${body}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
