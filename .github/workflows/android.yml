name: Android

on:
  # Every branch, not just main. This is a solo repo where most work happens on
  # feature/* branches, and the whole point of CI here is that nothing gets built
  # locally — so a branch that never builds would go unnoticed until merge time.
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 本機沒有 Android Studio,產不出 gradle-wrapper.jar(二進位檔),
      # 所以 CI 直接裝 Gradle 跑,不透過 wrapper。
      # 之後在 server 用 Android Studio 開專案時它會自動補上 wrapper,
      # 屆時可以把這一步換成 ./gradlew。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
